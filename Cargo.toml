[package]
name = "self-update-extras"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Joseph Wortmann <joseph.wortmann@gmail.com>"]
description = "Composable self-update helpers for CLI binaries: throttle, restart, and silence wrappers around any self_update ReleaseUpdate backend"
license = "Apache-2.0"
repository = "https://github.com/hyper-mcp-rs/self-update-extras"
homepage = "https://github.com/hyper-mcp-rs/self-update-extras"
documentation = "https://docs.rs/self-update-extras"
readme = "README.md"
keywords = ["self-update", "updater", "cli", "release", "github"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
self_update = { version = "0.44", default-features = false, features = [
    "reqwest",
    "rustls",
] }

# `silence` redirects file descriptor 1 via `dup`/`dup2`, which are not exposed
# by `std`. Only needed on Unix; other platforms fall back to a no-op.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
serial_test = "4.0"

[package.metadata.release]
publish = true
push = true
tag = true
tag-name = "v{{version}}"
